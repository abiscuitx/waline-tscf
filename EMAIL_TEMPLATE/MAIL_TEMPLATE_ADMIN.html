<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  style="width: 100%; height: 100%; background-color: #f4f6f8"
>
  <tbody>
    <tr>
      <td>
        <!-- preheader: hidden preview text for some mail clients -->
        <span
          style="
            display: none;
            font-size: 1px;
            line-height: 1px;
            max-height: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            color: transparent;
          "
          >{{site.name}} 有新评论 — 点击查看详情</span
        >

        <div
          style="
            max-width: 666px;
            margin: 28px auto;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #eee;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
            font-family: Helvetica, Arial, sans-serif;
            color: #555;
            font-size: 16px;
          "
        >
          <div
            style="
              background-color: #4af6de;
              color: #fff;
              padding: 18px 20px;
              text-align: center;
            "
          >
            <h1 style="font-size: 20px; margin: 0">{{site.name}} 有新评论</h1>
          </div>

          <div style="text-align: center; padding: 18px 0 8px 0">
            <img
              src="{{site.logo || ''}}"
              alt="{{site.name}}"
              width="220"
              height="44"
              style="border: 0; display: inline-block"
            />
          </div>

          <div style="padding: 0 20px 24px 20px">
            <p style="font-size: 16px; margin: 0 0 12px 0">
              你好，<strong style="color: #222">{{site.name}}</strong>
              有一条新的评论通知，摘要如下：
            </p>

            <table
              width="100%"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
              style="margin-top: 8px; border-collapse: collapse"
            >
              <tr>
                <td style="vertical-align: top; padding-right: 12px">
                  <div
                    style="
                      background: #f7f7f7;
                      padding: 12px;
                      border-radius: 6px;
                      border: 1px solid #eee;
                    "
                  >
                    <p style="margin: 0 0 8px 0; font-size: 14px">
                      <strong>评论者：</strong> {{self.nick || '匿名'}}
                    </p>
                    <p style="margin: 0 0 8px 0; font-size: 14px">
                      <strong>邮箱：</strong> {{self.mail || ''}}
                    </p>
                    <p style="margin: 0 0 8px 0; font-size: 14px">
                      <strong>内容：</strong>
                    </p>
                    <div
                      style="
                        background: #fff;
                        padding: 10px;
                        border-radius: 4px;
                        border: 1px solid #eee;
                        color: #333;
                        line-height: 1.45;
                      "
                    >
                      {{self.comment | safe}}
                    </div>
                  </div>
                </td>
                <td
                  style="
                    width: 160px;
                    vertical-align: middle;
                    text-align: center;
                  "
                >
                  <a
                    href="{{site.postUrl}}"
                    role="button"
                    aria-label="查看详情"
                    style="
                      display: inline-block;
                      padding: 12px 18px;
                      background: #ea9448;
                      color: #ffffff;
                      border-radius: 6px;
                      text-decoration: none;
                      font-weight: 600;
                    "
                    >查看详情</a
                  >
                </td>
              </tr>
            </table>

            <p style="font-size: 12px; color: #999; margin-top: 14px">
              如果不希望收到此类邮件，请在站点设置中关闭通知。
            </p>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>
